services:
  api:
    build: .
    container_name: maintenance_api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/safi_maintenance
      - JWT_SECRET=supersecretkey_safi_2026
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    container_name: maintenance_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: